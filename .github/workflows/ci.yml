name: CI

on:
  push:
    # claude/airbnb-competitor-1fjjpk is the repository's default branch, where
    # development happens; main is kept as it was. Named explicitly because
    # $default-branch only works in workflow templates, not in a repository's
    # own workflows.
    branches: [main, claude/airbnb-competitor-1fjjpk]
  pull_request:

env:
  DATABASE_URL: postgresql://fystay:fystay@localhost:5432/fystay?schema=public
  DIRECT_URL: postgresql://fystay:fystay@localhost:5432/fystay?schema=public
  AUTH_SECRET: ci-test-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_BASE_URL: http://localhost:3000

jobs:
  test:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fystay
          POSTGRES_PASSWORD: fystay
          POSTGRES_DB: fystay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fystay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The immutability check compares migrations with the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check migration immutability
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run db:check-migrations -- --base "$BASE_SHA"

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npx prisma migrate deploy

      - name: Build (must make 0 database connections)
        run: node scripts/ci/check-build-database-free.mjs

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fystay
          POSTGRES_PASSWORD: fystay
          POSTGRES_DB: fystay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fystay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run db:seed

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
